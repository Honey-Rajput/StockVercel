version: '3.8'

services:
  # Python ML backend (runs scheduler for daily analysis)
  analyzer:
    build: .
    container_name: stock-analyzer
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ALERT_MODE=${ALERT_MODE:-telegram}
    volumes:
      - ./output:/app/output
      - ./models:/app/models
